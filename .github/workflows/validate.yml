# 注册表 CI 门禁：全量校验条目元数据。
#
# URL 连通性检查在无网络或可达时验证；语法与格式严格检验。
# 本地测试与严格门禁命令：node scripts/validate.mjs --test

name: validate

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate registry entries
        run: node scripts/validate.mjs
